version: 1
project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/taskpony.lpk
update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: taskpony
build:
  run_buildscript: false
images:
  - id: taskpony
    target: service
    service: taskpony
    source: digdilem/taskpony
    channel: stable
    tag_regex: '^v?\.?[0-9]+\.[0-9]+$'
    version_regex: '^v?\.?(?P<version>[0-9]+\.[0-9]+)$'
    version_template: '{version}.0'
    delivery:
      mode: lazycat
stores:
  official:
    enabled: true
    skip_if_version_exists: true
  private:
    enabled: true
    skip_if_version_exists: true
    name: Taskpony
    summary: 一个小巧整洁的任务整理器
