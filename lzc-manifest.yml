application:
  subdomain: taskpony
  upstreams:
    - location: /
      backend: http://taskpony:5000/
  background_task: true
  multi_instance: true
services:
  taskpony:
    # digdilem/taskpony:0.2d
    # upstream: digdilem/taskpony:v.0.6
    image: registry.lazycat.cloud/czyt/digdilem/taskpony:b399442e78dd10d2
    binds:
      - /lzcapp/var/db:/opt/taskpony/db
    cpu_shares: 512
    mem_limit: 512M
    healthcheck:
      test:
        - CMD-SHELL
        - curl -f http://localhost:5000/ || exit 1
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
